<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة المشرف</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef7ff;
      color: #222;
    }

    header {
      background: #6c4ab6;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 950px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #6c4ab6;
      margin-top: 0;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #e8f7e8;
      color: #216b21;
      margin-bottom: 15px;
    }

    .error {
      background: #ffe8e8;
      color: #9b2222;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .user {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .user strong {
      color: #6c4ab6;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 8px;
      background: #eee;
      margin-top: 7px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>لوحة المشرف</h1>
  <p>إدارة منصة إنشاء الفيديو</p>
</header>

<div class="container">

  <div class="card">
    <h2>معلومات المشرف</h2>
    <div id="adminInfo" class="status">
      جاري التحقق من صلاحيات المشرف...
    </div>
  </div>

  <div class="card">
    <h2>إدارة المستخدمين</h2>

    <input
      type="text"
      id="searchInput"
      placeholder="ابحث بالاسم أو البريد الإلكتروني..."
    >

    <div id="usersStatus" class="status">
      جاري تحميل المستخدمين...
    </div>

    <div id="usersList"></div>
  </div>

</div>

<script>
let allUsers = [];

async function loadAdmin() {
  try {
    const response = await fetch("/api/admin/test");

    if (!response.ok) {
      throw new Error("غير مصرح");
    }

    const data = await response.json();

    document.getElementById("adminInfo").innerHTML =
      "تم التحقق بنجاح ✅<br>" +
      "المشرف: " + data.admin.name + "<br>" +
      "البريد: " + data.admin.email;

    loadUsers();

  } catch (error) {
    const box = document.getElementById("adminInfo");
    box.textContent = "غير مصرح لك بالدخول إلى لوحة المشرف.";
    box.classList.add("error");
  }
}

async function loadUsers() {
  try {
    const response = await fetch("/api/admin/users");

    if (!response.ok) {
      throw new Error("تعذر تحميل المستخدمين");
    }

    const data = await response.json();

    allUsers = data.users || [];

    document.getElementById("usersStatus").textContent =
      "عدد المستخدمين: " + allUsers.length;

    renderUsers(allUsers);

  } catch (error) {
    const box = document.getElementById("usersStatus");
    box.textContent = "تعذر تحميل قائمة المستخدمين.";
    box.classList.add("error");
  }
}

function renderUsers(users) {
  const list = document.getElementById("usersList");
  list.innerHTML = "";

  if (users.length === 0) {
    list.innerHTML = "<p>لا يوجد مستخدمون.</p>";
    return;
  }

  users.forEach(user => {
    const div = document.createElement("div");
    div.className = "user";

    div.innerHTML =
      "<strong>" + escapeHtml(user.name) + "</strong><br>" +
      "البريد: " + escapeHtml(user.email) + "<br>" +
      "النقاط: " + user.points + "<br>" +
      "الدور: " + escapeHtml(user.role) + "<br>" +
      "الحالة: " + (user.active ? "نشط ✅" : "غير نشط ❌") +
      "<br><span class='badge'>ID: " +
      escapeHtml(user.id) +
      "</span>";

    list.appendChild(div);
  });
}

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

document.getElementById("searchInput").addEventListener("input", function() {
  const text = this.value.toLowerCase().trim();

  const filtered = allUsers.filter(user =>
    user.name.toLowerCase().includes(text) ||
    user.email.toLowerCase().includes(text)
  );

  renderUsers(filtered);
});

loadAdmin();
</script>

</body>
</html>
